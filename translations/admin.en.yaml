"help.article_alt": "What the image shows, if it carries information. A mood illustration is decorative."
"help.article_body": "Markdown: paragraphs separated by an empty line, ## for a subheading, - for a list, [text](address) for a link. HTML is shown as typed, never interpreted."
"help.article_format": "List of the “Formats” section."
"help.article_section": "List of the “Sections” section."
"help.attribute_code": "Lowercase letters, digits and hyphens, starting with a letter: it appears in the catalog filters. It cannot change after creation."
"help.audio": "MP3, M4A or OGG, 100 MB at most. The duration is read from the file. Without a file, the current audio is kept."
"help.category_slug": "Lowercase letters, digits and hyphens: it appears in the site addresses (?category=…)."
"help.choices": "Value lists only, in display order. Emptying a row removes the value; saving adds new empty rows."
"help.color_scheme": "Theme served until the visitor chooses one."
"help.contact_recipient": "Contact messages and enquiries. Never shown on the site."
"help.featured": "Shown in the home page carousel, in alphabetical order."
"help.filterable": "Value lists only: a catalog facet."
"help.gallery": "%max% images at most, besides the main image, by increasing position. Saving offers new rows to add images."
"help.gallery_alt": "Empty: the product name."
"help.image_cropped": "JPEG, PNG, WebP or AVIF, 10 MB at most, cropped to the centre at %ratioWidth%:%ratioHeight%, at least %min% px wide. Without a file, the current image is kept."
"help.image_cropped_sharpest": "JPEG, PNG, WebP or AVIF, 10 MB at most, cropped to the centre at %ratioWidth%:%ratioHeight%, at least %min% px wide, %largest% px for the sharpest result (never enlarged). Without a file, the current image is kept."
"help.image_icon": "PNG, WebP or AVIF (transparency kept), square, at least %min% px wide, cropped to the centre. No SVG or ICO. Favicons are generated as 32, 180, 192 and 512 px PNG files."
"help.image_uncropped": "PNG, WebP or AVIF (transparency kept) or JPEG, 10 MB at most, not cropped, at least %min% px wide. No SVG. Without a file, the current image is kept."
"help.legal_body": "Each “##” heading opens a section. Links: [text](https://…). Lists: one line per item, starting with “-”. HTML is shown as typed, never interpreted."
"help.library_colors": "Checked: no brand colours, front ends keep the boilerplates-ui tokens and the two colours below are ignored."
"help.meta_description": "%max% characters at most. Empty: the description computed by the front end."
"help.meta_title": "%max% characters at most. Empty: the title computed by the front end."
"help.primary_color": "Colour of links and buttons: it must reach a contrast of at least 4.5:1 with the white background. The dark theme and the shades are computed."
"help.product_alt": "Empty: the product name, which is usually enough."
"help.product_description": "Plain text, shown on the product page. An empty line separates two paragraphs."
"help.remove_icon": "Front ends then serve their own favicons. A file sent at the same time is ignored."
"help.remove_ignores_upload": "A file sent at the same time is ignored."
"help.remove_logo": "The header then shows the pictogram and the site name. A file sent at the same time is ignored."
"help.remove_share_image": "Front ends then serve their own sharing image. A file sent at the same time is ignored."
"help.sales": "Unchecked: front ends show no prices or cart, each product offers an enquiry sent by email."
"help.secondary_color": "It must carry readable text (white or near-black at 4.5:1 at least)."
"help.site_alt": "Empty: the site name."
"help.speaker": "Shown with the audio player, %max% characters at most."
"help.tagline": "Home page hero text and default page description."
"help.term_slug": "Lowercase letters, digits and hyphens, 60 characters at most: it appears in the blog addresses."
"help.unit": "Optional: “mm”, “km”, “cm”."
