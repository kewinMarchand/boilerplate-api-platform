# Règles de dépendance entre modules et couches (R12 de ARCHITECTURE-DDD.md).
# Domain ne dépend que de lui-même (ni framework, ni autre couche), Application du Domain de son
# module, Infrastructure de son module, de Shared et des frameworks. Aucun module n'en importe un autre.
# make arch-selftest vérifie qu'une violation volontaire fait bien échouer l'analyse.
deptrac:
    paths:
        - ./src
    layers:
        - name: CatalogDomain
          collectors:
            - type: classLike
              value: '^App\\Catalog\\Domain\\'
        - name: CatalogApplication
          collectors:
            - type: classLike
              value: '^App\\Catalog\\Application\\'
        - name: CatalogInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Catalog\\Infrastructure\\'
        - name: BlogDomain
          collectors:
            - type: classLike
              value: '^App\\Blog\\Domain\\'
        - name: BlogApplication
          collectors:
            - type: classLike
              value: '^App\\Blog\\Application\\'
        - name: BlogInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Blog\\Infrastructure\\'
        - name: ContentDomain
          collectors:
            - type: classLike
              value: '^App\\Content\\Domain\\'
        - name: ContentApplication
          collectors:
            - type: classLike
              value: '^App\\Content\\Application\\'
        - name: ContentInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Content\\Infrastructure\\'
        - name: ContactDomain
          collectors:
            - type: classLike
              value: '^App\\Contact\\Domain\\'
        - name: ContactInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Contact\\Infrastructure\\'
        - name: TaskDomain
          collectors:
            - type: classLike
              value: '^App\\Task\\Domain\\'
        - name: TaskInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Task\\Infrastructure\\'
        - name: MediaDomain
          collectors:
            - type: classLike
              value: '^App\\Media\\Domain\\'
        - name: MediaApplication
          collectors:
            - type: classLike
              value: '^App\\Media\\Application\\'
        - name: MediaInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Media\\Infrastructure\\'
        - name: SharedInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Shared\\Infrastructure\\'
        # Admin (ADR 0001) : adaptateur d'entrée, comme API Platform. Il écrit par les cas d'usage des modules
        # administrés et lit leurs entités pour les listes ; il n'a ni domaine ni application à lui.
        - name: AdminInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Admin\\Infrastructure\\'
        - name: Framework
          collectors:
            - type: classLike
              value: '^(Symfony|Doctrine|ApiPlatform|Psr|Sentry|EasyCorp|League\\CommonMark)\\'
    ruleset:
        CatalogDomain: [MediaDomain]
        CatalogApplication: [CatalogDomain, MediaDomain, MediaApplication]
        CatalogInfrastructure: [CatalogDomain, CatalogApplication, MediaDomain, MediaApplication, MediaInfrastructure, SharedInfrastructure, Framework]
        BlogDomain: [MediaDomain]
        BlogApplication: [BlogDomain, MediaDomain, MediaApplication]
        BlogInfrastructure: [BlogDomain, MediaDomain, MediaApplication, MediaInfrastructure, SharedInfrastructure, Framework]
        ContentDomain: [MediaDomain]
        ContentApplication: [ContentDomain, MediaDomain, MediaApplication]
        ContentInfrastructure: [ContentDomain, MediaDomain, MediaApplication, MediaInfrastructure, SharedInfrastructure, Framework]
        ContactDomain: ~
        ContactInfrastructure: [ContactDomain, SharedInfrastructure, Framework]
        TaskDomain: ~
        TaskInfrastructure: [TaskDomain, SharedInfrastructure, Framework]
        MediaDomain: ~
        MediaApplication: [MediaDomain]
        MediaInfrastructure: [MediaDomain, MediaApplication, SharedInfrastructure, Framework]
        SharedInfrastructure: [Framework]
        AdminInfrastructure: [CatalogDomain, CatalogApplication, BlogDomain, BlogApplication, ContentDomain, ContentApplication, MediaDomain, MediaApplication, MediaInfrastructure, SharedInfrastructure, Framework]
