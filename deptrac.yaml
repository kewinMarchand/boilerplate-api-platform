# Règles de dépendance entre modules et couches (R12 de ARCHITECTURE-DDD.md).
# Domain ne dépend que de lui-même et du noyau partagé (Shared\Domain), Application du Domain de son
# module, Infrastructure de son module, de Shared et des frameworks. Aucun module n'en importe un autre.
# make arch-selftest vérifie qu'une violation volontaire fait bien échouer l'analyse.
deptrac:
    paths:
        - ./src
    layers:
        - name: CatalogDomain
          collectors:
            - type: classLike
              value: '^App\\Catalog\\Domain\\'
        - name: CatalogApplication
          collectors:
            - type: classLike
              value: '^App\\Catalog\\Application\\'
        - name: CatalogInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Catalog\\Infrastructure\\'
        - name: BlogDomain
          collectors:
            - type: classLike
              value: '^App\\Blog\\Domain\\'
        - name: BlogApplication
          collectors:
            - type: classLike
              value: '^App\\Blog\\Application\\'
        - name: BlogInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Blog\\Infrastructure\\'
        - name: ContentDomain
          collectors:
            - type: classLike
              value: '^App\\Content\\Domain\\'
        - name: ContentApplication
          collectors:
            - type: classLike
              value: '^App\\Content\\Application\\'
        - name: ContentInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Content\\Infrastructure\\'
        - name: ContactDomain
          collectors:
            - type: classLike
              value: '^App\\Contact\\Domain\\'
        - name: ContactApplication
          collectors:
            - type: classLike
              value: '^App\\Contact\\Application\\'
        - name: ContactInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Contact\\Infrastructure\\'
        - name: TaskDomain
          collectors:
            - type: classLike
              value: '^App\\Task\\Domain\\'
        - name: TaskInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Task\\Infrastructure\\'
        - name: MediaDomain
          collectors:
            - type: classLike
              value: '^App\\Media\\Domain\\'
        - name: MediaApplication
          collectors:
            - type: classLike
              value: '^App\\Media\\Application\\'
        - name: MediaInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Media\\Infrastructure\\'
        - name: SiteDomain
          collectors:
            - type: classLike
              value: '^App\\Site\\Domain\\'
        - name: SiteApplication
          collectors:
            - type: classLike
              value: '^App\\Site\\Application\\'
        - name: SiteInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Site\\Infrastructure\\'
        # Noyau partagé (ADR 0015) : traductions des agrégats et violations de règles, sans framework
        - name: SharedDomain
          collectors:
            - type: classLike
              value: '^App\\Shared\\Domain\\'
        - name: SharedInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Shared\\Infrastructure\\'
        # Admin (ADR 0001) : adaptateur d'entrée, comme API Platform. Il écrit par les cas d'usage des modules
        # administrés et lit leurs entités pour les listes ; il n'a ni domaine ni application à lui.
        - name: AdminInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Admin\\Infrastructure\\'
        - name: Framework
          collectors:
            - type: classLike
              value: '^(Symfony|Doctrine|ApiPlatform|Psr|Sentry|EasyCorp|League\\CommonMark)\\'
    ruleset:
        CatalogDomain: [SharedDomain, MediaDomain]
        CatalogApplication: [SharedDomain, CatalogDomain, MediaDomain, MediaApplication]
        CatalogInfrastructure: [SharedDomain, CatalogDomain, CatalogApplication, MediaDomain, MediaApplication, MediaInfrastructure, SharedInfrastructure, Framework]
        BlogDomain: [SharedDomain, MediaDomain]
        BlogApplication: [SharedDomain, BlogDomain, MediaDomain, MediaApplication]
        BlogInfrastructure: [SharedDomain, BlogDomain, MediaDomain, MediaApplication, MediaInfrastructure, SharedInfrastructure, Framework]
        ContentDomain: [SharedDomain, MediaDomain]
        ContentApplication: [SharedDomain, ContentDomain, MediaDomain, MediaApplication]
        ContentInfrastructure: [SharedDomain, ContentDomain, MediaDomain, MediaApplication, MediaInfrastructure, SharedInfrastructure, Framework]
        ContactDomain: [SharedDomain]
        ContactApplication: [SharedDomain, ContactDomain]
        # Adaptateurs du contact (ADR 0014) : produit lu dans le catalogue, destinataire dans l'identité du site
        ContactInfrastructure: [SharedDomain, ContactDomain, ContactApplication, CatalogDomain, SiteDomain, SiteApplication, SharedInfrastructure, Framework]
        TaskDomain: [SharedDomain]
        TaskInfrastructure: [SharedDomain, TaskDomain, SharedInfrastructure, Framework]
        MediaDomain: [SharedDomain]
        MediaApplication: [SharedDomain, MediaDomain]
        MediaInfrastructure: [SharedDomain, MediaDomain, MediaApplication, SharedInfrastructure, Framework]
        SiteDomain: [SharedDomain, MediaDomain]
        SiteApplication: [SharedDomain, SiteDomain, MediaDomain, MediaApplication]
        SiteInfrastructure: [SharedDomain, SiteDomain, SiteApplication, MediaDomain, MediaApplication, MediaInfrastructure, SharedInfrastructure, Framework]
        SharedDomain: ~
        SharedInfrastructure: [SharedDomain, Framework]
        AdminInfrastructure: [SharedDomain, CatalogDomain, CatalogApplication, BlogDomain, BlogApplication, ContentDomain, ContentApplication, ContactDomain, SiteDomain, SiteApplication, MediaDomain, MediaApplication, MediaInfrastructure, SharedInfrastructure, Framework]
